<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梁支持条件 Phase 5</title><style>body{margin:0;background:#edf3f8;color:#20394f;font:16px system-ui}header{background:#122c43;color:#fff;padding:18px}main{max-width:800px;margin:auto;padding:14px}section{background:#fff;border-radius:12px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}label{display:block;font-size:13px}input,select{font-size:16px;width:100%;padding:9px;box-sizing:border-box}h1{font-size:21px;margin:0}h2{font-size:17px}svg{width:100%}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.results div{background:#eef4fa;padding:12px;border-radius:8px}strong{display:block}small,p{color:#586d7f}</style><header><h1>仮設梁計算 Phase 5</h1><small style="color:#dce8f4">支持条件の比較・有限要素法の試作</small></header><main><section><h2>梁・荷重条件</h2><div class="grid"><label>支持条件<select id="support"><option value="simple">単純支持</option><option value="cantilever-left">左端固定・右端自由（片持ち）</option><option value="fixed-fixed">両端固定</option><option value="fixed-pinned">左端固定・右端支持</option></select></label><label>スパン L (m)<input id="L" type="number" value="6" min=".1" step=".1"></label><label>集中荷重 P (kN)<input id="P" type="number" value="20" min="0"></label><label>荷重位置 a (m)<input id="a" type="number" value="3" min="0"></label><label>全長分布荷重 w (kN/m)<input id="w" type="number" value="0" min="0"></label><label>E (N/mm²)<input id="E" type="number" value="205000"></label><label>I (mm⁴)<input id="I" type="number" value="80000000"></label></div><p id="error" style="color:#ba3344" role="alert"></p></section><section><h2>支持条件と変形</h2><svg id="svg" viewBox="0 0 700 230"></svg></section><section><h2>計算結果</h2><div id="result" class="results"></div></section><section><p>有限要素法による試作です。変位は節点評価で、最大値は厳密な極値ではありません。SFD/BMDや断面照査との統合は今後の更新対象です。施工判断には別途照査してください。</p><a href="./phase4.html">荷重ケース・保存機能付きの従来画面</a></section></main><script type="module">import {solveSupportedBeam} from './beam-supports.js';const $=id=>document.getElementById(id),fmt=(n)=>Number(n).toFixed(3);function draw(){try{const L=+$('L').value,a=+$('a').value,P=+$('P').value,w=+$('w').value,E=+$('E').value,I=+$('I').value,support=$('support').value;const r=solveSupportedBeam({L,E,I,support,pointLoads:[{P,a}],patchLoads:w?[{w,a:0,b:L}]:[]});$('error').textContent='';$('result').innerHTML=[['左端鉛直反力',r.RA,'kN'],['右端鉛直反力',r.RB,'kN'],['最大節点たわみ',r.maxDeflection,'mm'],['拘束反力成分数',r.reactions.length,'個']].map(([name,v,unit])=>'<div><small>'+name+'</small><strong>'+fmt(v)+' '+unit+'</strong></div>').join('');const max=Math.max(.001,r.maxDeflection),path=r.points.map((p,i)=>(i?'L':'M')+(50+600*p.x/L).toFixed(1)+','+(105+60*p.y/max).toFixed(1)).join(' ');const left=support==='simple'?'M50 115 l-15 22 h30z':'M35 55 V155 H50 V55Z',right=support==='simple'||support==='fixed-pinned'?'M650 115 l-15 22 h30z':support==='fixed-fixed'?'M650 55 H665 V155 H650Z':'';$('svg').innerHTML='<line x1="50" y1="105" x2="650" y2="105" stroke="#718ca3" stroke-width="6"/><path d="'+left+' '+right+'" fill="#a9bbcc"/><path d="'+path+'" fill="none" stroke="#d04d65" stroke-width="3"/><text x="50" y="195" font-size="13">赤線：変形（拡大表示）</text>'}catch(e){$('error').textContent='計算できません: '+e.message;$('result').innerHTML='';$('svg').innerHTML=''}}document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',draw));draw();</script></html>
