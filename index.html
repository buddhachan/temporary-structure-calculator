<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10283f"><link rel="manifest" href="./manifest.webmanifest"><title>仮設梁計算</title><style>body{font:16px system-ui;margin:0;background:#edf3f8;color:#183249}header{background:#10283f;color:white;padding:20px}h1{margin:0;font-size:22px}main{max-width:850px;margin:auto;padding:14px}section{background:white;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #0001}h2{font-size:18px;margin-top:0}.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}label{font-size:13px}input{box-sizing:border-box;width:100%;padding:10px;margin-top:5px;font-size:16px;border:1px solid #bdcbd7;border-radius:8px}svg{width:100%;touch-action:none}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.results div{background:#eff5fa;border-radius:8px;padding:12px}.results strong{display:block;font-size:19px}.results small{color:#536d82}p{font-size:13px;line-height:1.7;color:#50677b}</style></head><body><header><h1>仮設梁計算</h1>単純梁・荷重ドラッグ操作</header><main><section><h2>入力条件</h2><div class="inputs"><label>スパン L (m)<input id="L" type="number" min=".1" step=".1" value="6"></label><label>集中荷重 P (kN)<input id="P" type="number" min="0" value="20"></label><label>荷重位置 a (m)<input id="a" type="number" min="0" step=".1" value="3"></label><label>全長等分布荷重 w (kN/m)<input id="w" type="number" min="0" value="0"></label><label>ヤング係数 E (N/mm²)<input id="E" type="number" min="1" value="205000"></label><label>断面二次モーメント I (mm⁴)<input id="I" type="number" min="1" value="80000000"></label></div></section><section><h2>梁モデル</h2><p>赤い荷重を指で左右に移動できます。</p><svg id="beam" viewBox="0 0 700 180"></svg></section><section><h2>計算結果</h2><div class="results"><div><small>左反力 RA</small><strong id="ra"></strong></div><div><small>右反力 RB</small><strong id="rb"></strong></div><div><small>最大せん断力</small><strong id="v"></strong></div><div><small>最大曲げモーメント</small><strong id="m"></strong></div><div><small>最大たわみ</small><strong id="d"></strong></div><div><small>最大たわみ位置</small><strong id="dx"></strong></div></div></section><section><h2>SFD・BMD・たわみ曲線</h2><svg id="graphs" viewBox="0 0 700 450"></svg></section><section><h2>注意事項</h2><p>線形弾性Euler-Bernoulli梁、単純支持、集中荷重1点と全長等分布荷重を想定。自重はwに含めてください。施工判断には使用せず、断面応力度・座屈・支持部・安全率などを別途照査してください。</p></section></main><script>
const $=id=>document.getElementById(id),f=(v,n=2)=>v.toFixed(n);
function update(){const L=+$('L').value,P=+$('P').value,w=+$('w').value,E=+$('E').value,I=+$('I').value;if(!(L>0&&P>=0&&w>=0&&E>0&&I>0))return;let a=Math.max(0,Math.min(L,+$('a').value||0));$('a').value=f(a,3);const b=L-a,RA=P*b/L+w*L/2,RB=P*a/L+w*L/2,EI=E*I;let pts=[];for(let i=0;i<=400;i++){const x=L*i/400,X=x*1000,A=a*1000,B=b*1000,T=L*1000;const V=RA-w*x-(x>=a?P:0),M=RA*x-w*x*x/2-P*Math.max(0,x-a);const yP=X<=A?(P*1000)*B*X*(T*T-B*B-X*X)/(6*T*EI):(P*1000)*A*(T-X)*(T*T-A*A-(T-X)**2)/(6*T*EI);const yW=w*X*(T**3-2*T*X*X+X**3)/(24*EI);pts.push({x,V,M,y:yP+yW})}const max=(k)=>pts.reduce((p,c)=>Math.abs(c[k])>Math.abs(p[k])?c:p);const mm=pts.reduce((p,c)=>c.M>p.M?c:p),dd=max('y');$('ra').textContent=f(RA)+' kN';$('rb').textContent=f(RB)+' kN';$('v').textContent=f(Math.max(Math.abs(RA),Math.abs(RB),Math.abs(RA-P),Math.abs(RB-P)))+' kN';$('m').textContent=f(mm.M)+' kN·m';$('d').textContent=f(Math.abs(dd.y),3)+' mm';$('dx').textContent=f(dd.x)+' m';const px=50+600*a/L;$('beam').innerHTML='<line x1="50" y1="95" x2="650" y2="95" stroke="#23435d" stroke-width="8"/><path d="M50 103 l-17 25 h34 z M650 103 l-17 25 h34 z" fill="#9eb6cb"/><line x1="30" y1="130" x2="70" y2="130" stroke="#23435d"/><line x1="630" y1="130" x2="670" y2="130" stroke="#23435d"/><g id="load"><line x1="'+px+'" y1="22" x2="'+px+'" y2="90" stroke="#d34c59" stroke-width="5"/><path d="M'+(px-12)+' 75 L'+px+' 96 L'+(px+12)+' 75" fill="#d34c59"/><circle cx="'+px+'" cy="22" r="17" fill="#d34c59"/><text x="'+px+'" y="10" text-anchor="middle" fill="#9c2a38" font-size="14">P '+f(P)+' kN</text></g><text x="350" y="163" text-anchor="middle" font-size="15">L = '+f(L)+' m / a = '+f(a)+' m</text>';let g='';[['V','せん断力 V (kN)','#347cbd'],['M','曲げモーメント M (kN·m)','#c88735'],['y','たわみ δ (mm)','#27927c']].forEach(([k,t,c],j)=>{const mid=78+j*146,limit=Math.max(1e-9,...pts.map(p=>Math.abs(p[k])));g+='<text x="50" y="'+(mid-58)+'" font-size="15">'+t+'</text><line x1="50" y1="'+mid+'" x2="650" y2="'+mid+'" stroke="#abb9c6" stroke-dasharray="4 4"/><path fill="none" stroke="'+c+'" stroke-width="3" d="'+pts.map((p,i)=>(i?'L':'M')+(50+600*p.x/L).toFixed(2)+','+(mid-43*p[k]/limit).toFixed(2)).join(' ')+'"/><text x="650" y="'+(mid+58)+'" text-anchor="end" font-size="12">'+f(L)+' m</text><text x="650" y="'+(mid-45)+'" text-anchor="end" font-size="12">±'+f(limit,k==='y'?3:2)+'</text>'});$('graphs').innerHTML=g}
['L','P','a','w','E','I'].forEach(id=>$(id).addEventListener('input',update));let dragging=false;const s=$('beam');s.addEventListener('pointerdown',e=>{if(e.target.closest('#load')){dragging=true;s.setPointerCapture(e.pointerId)}});s.addEventListener('pointermove',e=>{if(!dragging)return;const r=s.getBoundingClientRect(),x=(e.clientX-r.left)*700/r.width;$('a').value=Math.max(0,Math.min(+$('L').value,(x-50)/600*(+$('L').value))).toFixed(3);update()});s.addEventListener('pointerup',()=>dragging=false);s.addEventListener('pointercancel',()=>dragging=false);update();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
